
name: SmartPark Sentinel CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Build - check Python files
        run: python -m compileall -q sparking.py database.py test_sparking.py

      - name: Run application with real SQLite database
        run: python sparking.py

      - name: Run automated tests
        run: python -m pytest -v
